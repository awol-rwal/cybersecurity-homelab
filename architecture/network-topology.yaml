document:
  fill: "#20252b"
  aspectRatio: "5:4"
  watermark: false

diagram:
  columns: 11
  rows: 11
  gridLines: false
  invertY: false

title:
  text: "Cybersecurity Homelab"
  subText: "Lab network and security monitoring"
  type: "bar"
  color: "white"
  fill: "#303841"
  stroke: "#303841"
  heightPercentage: 7

desktop: &desktop
  iconFamily: "Iconify"
  icon: "lucide:monitor"
  color: "white"
  fill: "#343e49"
  stroke: "#8fa2b5"
  iconFill: "#ffffff"
  textLocation: "bottom"

server: &server
  <<: *desktop
  icon: "lucide:server"

icons:
  kaliDesktop:
    <<: *desktop
    x: 1.5
    y: 1.3
    text: "Kali Desktop | 10.77.77.10"

  ubuntuDesktop:
    <<: *desktop
    x: 5
    y: 1.3
    text: "Ubuntu Desktop | 10.77.77.30"

  windowsVM:
    <<: *desktop
    x: 8.5
    y: 1.3
    text: "Windows 11 VM | IP unassigned"

  labSwitch:
    <<: *desktop
    icon: "lucide:network"
    x: 5
    y: 4
    text: "Lab network"

  juiceShopServer:
    <<: *server
    x: 2.5
    y: 6.7
    text: "Juice Shop Server | 10.77.77.20"

  wazuhServer:
    <<: *server
    x: 7.5
    y: 6.7
    text: "Wazuh Server | 10.77.77.40"

notes:
  webServices:
    x: 2.5
    y: 9
    w: 3.2
    h: 1.2
    xAlign: center
    yAlign: center
    color: "white"
    fill: "#344352"
    stroke: "#8fa2b5"
    text: "**Ubuntu Web Server**\n\nDocker / OWASP Juice Shop\nNginx reverse proxy\nWazuh agent"

  wazuhServices:
    x: 7.5
    y: 9
    w: 3.2
    h: 1.2
    xAlign: center
    yAlign: center
    color: "white"
    fill: "#344352"
    stroke: "#8fa2b5"
    text: "**Ubuntu Monitoring Server**\n\nWazuh manager\nWazuh indexer / dashboard"

connections:
  - {endpoints: ["kaliDesktop", "labSwitch"], stroke: "#cbd5e1"}
  - {endpoints: ["ubuntuDesktop", "labSwitch"], stroke: "#cbd5e1"}
  - {endpoints: ["windowsVM", "labSwitch"], stroke: "#cbd5e1"}
  - {endpoints: ["labSwitch", "juiceShopServer"], stroke: "#cbd5e1"}
  - {endpoints: ["labSwitch", "wazuhServer"], stroke: "#cbd5e1"}
  # Logical telemetry flow over the same network; not a separate physical cable.
  - endpoints: ["juiceShopServer", "wazuhServer"]
    stroke: "#45c8a5"
    strokeWidth: 2
    strokeDashArray: "6,4"
